<text x="40" y="416" class="fuss">&#946; ist die Orientierung der Modulebene. Hier aufgezogen vom Ost-Strahl zur Normalen der Vorderseite; Seite A liegt bei Azimut &#946; &#8722; 90&#176;, Seite B bei &#946; + 90&#176;.</text>
<text x="40" y="434" class="fuss">Der Azimut wird wie bei PVGIS von S&#252;d gez&#228;hlt, negativ nach Ost und positiv nach West. Alle drei Aufstellungen stehen senkrecht, Neigung 90&#176;.</text>
<text x="40" y="452" class="fuss">Bei &#946; = 0 verl&#228;uft die Modulebene in Nord-S&#252;d-Richtung, die Fl&#228;chen zeigen nach Ost und West. Bei &#946; = +90&#176; nach S&#252;d und Nord.</text>
<text x="40" y="470" class="fuss">Die um 180&#176; gedrehte Montage belegt dieselbe Ebene mit vertauschten Seiten; der Faktor 1,0 liegt dann auf der anderen Himmelsrichtung.</text>
