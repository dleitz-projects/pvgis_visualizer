<text x="40" y="480" class="fuss">&#946; ist die Orientierung der Modulebene, gemessen von der S&#252;dachse zur Spur der Ebene. In der Draufsicht erscheint dieser Winkel in wahrer Gr&#246;&#223;e.</text>
<text x="40" y="498" class="fuss">Die Modulst&#228;rke ist &#252;berh&#246;ht gezeichnet, damit Vorder- und R&#252;ckseite unterscheidbar bleiben. Seite A liegt bei Azimut &#946; &#8722; 90&#176;, Seite B bei &#946; + 90&#176;.</text>
<text x="40" y="516" class="fuss">Der Azimut wird wie bei PVGIS von S&#252;d gez&#228;hlt, negativ nach Ost und positiv nach West. Alle drei Aufstellungen stehen senkrecht, Neigung 90&#176;.</text>
<text x="40" y="534" class="fuss">Bei &#946; = 0 verl&#228;uft die Modulebene in Nord-S&#252;d-Richtung, die Fl&#228;chen zeigen nach Ost und West. Bei &#946; = +90&#176; nach S&#252;d und Nord.</text>
<text x="40" y="552" class="fuss">Die um 180&#176; gedrehte Montage belegt dieselbe Ebene mit vertauschten Seiten; der Faktor 1,0 liegt dann auf der anderen Himmelsrichtung.</text>
